<!doctype html>
<html lang="en" data-page="enrichment">
<head>
<!--@head-->
<link rel="stylesheet" href="/src/styles/main.css">
<link rel="stylesheet" href="/src/styles/pages.css">
</head>
<body>
<!--@body-start-->

<!--@site-head-->
<!--@menu-->

<main id="main">

<!--@subnav-->

<!-- 01 · Enrichment: after school, open to all kids -->
<section class="enrichment page-top" id="enrichment" aria-labelledby="enrichment-title" data-sprout>
  <div class="wrap">
    <div class="program-head">
      <div>
        <p class="eyebrow program-eyebrow"><span class="program-num" aria-hidden="true">01</span>Try it · After school in Omaha</p>
        <h1 class="h2" id="enrichment-title" data-split><em>Enrichment</em></h1>
        <p class="sub">{{enrichment.intro}}</p>
      </div>
      <!-- Day strip: each pill jumps to (and highlights) that day's card (from SCHEDULE) -->
      <!--@day-strip-->
    </div>
    <article class="enrichment-feature" id="golf" aria-labelledby="golf-title">
      <figure class="golf-photo">
        <img data-photo="{{photo:enrichment.golf.photo}}" sizes="(max-width: 767px) 100vw, 640px" alt="{{enrichment.golf.photoAlt}}" fetchpriority="high">
        <!-- A little putt rolls into the hole when the card comes into view -->
        <svg class="golf-putt" viewBox="0 0 300 110" aria-hidden="true">
          <defs><mask id="putt-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="110"><path class="putt-reveal" d="M22 86 C 80 58, 150 106, 246 90" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/></mask></defs>
          <path class="putt-path" d="M22 86 C 80 58, 150 106, 246 90" fill="none" mask="url(#putt-mask)"/>
          <ellipse class="putt-hole" cx="250" cy="92" rx="15" ry="4.5"/>
          <path class="putt-pole" d="M250 91 V 18"/>
          <path class="putt-flag" d="M250 19 C 262 21, 272 26, 286 29 C 274 34, 262 38, 250 42 z"/>
          <circle class="putt-ball" cx="250" cy="89" r="6.5"/>
        </svg>
      </figure>
      <div class="golf-badge" aria-hidden="true">
        <svg class="golf-badge-ring" viewBox="0 0 120 120"><defs><path id="golf-ring" d="M60 60 m-44 0 a44 44 0 1 1 88 0 a44 44 0 1 1 -88 0"/></defs><text class="ring-long"><textPath href="#golf-ring" textLength="274" lengthAdjust="spacing">GOLF · TUESDAYS · STARTS JAN 5 ·</textPath></text><text class="ring-short"><textPath href="#golf-ring" textLength="274" lengthAdjust="spacing">GOLF · TUESDAYS · JAN 5 ·</textPath></text></svg>
        <svg class="golf-badge-core"><use href="#d-flag"/></svg>
      </div>
      <div class="program-copy">
        <h3 id="golf-title">{{enrichment.golf.title}}</h3>
        <ul class="golf-chips">
          <!--@golf-chips-->
        </ul>
        <dl class="golf-sessions">
          <!--@golf-sessions-->
        </dl>
        <a class="btn btn-primary" href="#visit" data-program-cta="golf"><span>{{enrichment.golf.button}}</span><i class="btn-dot"></i></a>
      </div>
    </article>
    <!-- Day cards and dots (from SCHEDULE) -->
    <!--@day-cards-->
  </div>
</section>



<!--@faq-enrichment-->

<!--@next-step-->

<!--@contact-->

</main>

<!--@site-foot-->
<!--@sticky-cta-->

<script type="module" src="/src/main.js"></script>
</body>
</html>
