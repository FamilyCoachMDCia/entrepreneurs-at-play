<!doctype html>
<html lang="en" data-page="home">
<head>
<!--@head-->
<link rel="stylesheet" href="/src/styles/main.css">
<link rel="stylesheet" href="/src/styles/pages.css">
</head>
<body>
<!--@body-start-->

<!-- 00 · Loader: the Arch & Sun draws itself, then the name (first visit from outside only; see loader.js) -->
<div class="loader" id="loader">
  <div class="loader-inner" aria-hidden="true">
    <svg class="loader-mark" viewBox="-8 -8 216 256" focusable="false">
      <defs><clipPath id="lm-ground"><rect x="-8" y="-8" width="216" height="248"/></clipPath></defs>
      <g clip-path="url(#lm-ground)"><path class="lm-sun" fill="#B78B4F" d="M54 240a46 46 0 0 1 92 0z"/></g>
      <g class="lm-rays" fill="none" stroke="#B78B4F" stroke-width="10" stroke-linecap="round">
        <path class="lm-ray" d="M51.5 212L35.9 203"/><path class="lm-ray" d="M72 191.5L63 175.9"/><path class="lm-ray" d="M100 184L100 166"/><path class="lm-ray" d="M128 191.5L137 175.9"/><path class="lm-ray" d="M148.5 212L164.1 203"/>
      </g>
      <g class="lm-strokes" fill="none" stroke="#3B5E1A" stroke-width="26">
        <path class="lm-arch" pathLength="1" d="M13 240V100A87 87 0 0 1 100 13"/>
        <path class="lm-arch" pathLength="1" d="M187 240V100A87 87 0 0 0 100 13"/>
      </g>
      <path class="lm-full" fill="#3B5E1A" d="M0 240V100a100 100 0 0 1 200 0v140h-26V100a74 74 0 0 0-148 0v140z"/>
    </svg>
    <p class="loader-word">Entrepreneurs <em>at Play</em></p>
    <p class="loader-line">A FamilyCoachMD program</p>
  </div>
  <button class="loader-skip" type="button">Skip intro</button>
</div>

<!--@site-head-->
<!--@menu-->

<main id="main">

<!-- 02 · Hero: the toy box -->
<section class="hero" id="top" aria-labelledby="hero-title">
  <div class="hero-copy">
    <p class="hero-rotator" aria-live="off">
      <span class="sr-only">CREATE: <!--@rot-sr--></span>
      <span class="rot" aria-hidden="true"><!--@rot-words--></span>
      <svg class="rot-underline" viewBox="0 0 200 20" aria-hidden="true"><use href="#d-underline"/></svg>
    </p>
    <h1 class="hero-title" id="hero-title" aria-label="Entrepreneurs at Play"><span class="line">Entrepreneurs</span> <span class="line">at <em>Play</em></span><!-- Phones only: two 3D toys beside "at Play" (see main.js loadToys) --><span class="hero-toyslot"><svg class="fb fb-slot-1" aria-hidden="true"><use href="#d-sun"/></svg><svg class="fb fb-slot-2" aria-hidden="true"><use href="#d-leaf"/></svg></span></h1>
    <p class="hero-tag"><span>{{site.tagline}}</span></p>
    <p class="hero-lede">{{home.heroLede}}</p>
  </div>
  <div class="hero-stage" id="hero-stage">
    <div class="toy-tip" role="status" aria-live="polite"></div>
    <div class="hero-fallback" aria-hidden="true">
      <svg class="fb fb-1"><use href="#d-sun"/></svg>
      <svg class="fb fb-2"><use href="#d-leaf"/></svg>
      <svg class="fb fb-3"><use href="#d-plane"/></svg>
      <svg class="fb fb-4"><use href="#d-star"/></svg>
      <svg class="fb fb-5"><use href="#d-sparkle"/></svg>
    </div>
  </div>
</section>

</main>

</body>
</html>
