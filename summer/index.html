<!doctype html>
<html lang="en" data-page="summer">
<head>
<!--@head-->
<link rel="stylesheet" href="/src/styles/main.css">
<link rel="stylesheet" href="/src/styles/pages.css">
</head>
<body>
<!--@body-start-->

<!--@site-head-->
<!--@menu-->

<main id="main">

<!-- 02 · Summer: the enrichment favorites, made bigger -->
<section class="summer page-top" id="summer" aria-labelledby="summer-title" data-sprout>
  <div class="wrap">
    <div class="summer-card">
      <div class="program-copy">
        <!-- A paper plane flies in once along a dotted path -->
        <svg class="summer-plane" viewBox="0 0 200 90" aria-hidden="true">
          <defs><mask id="plane-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="90"><path class="plane-reveal" d="M6 80 C 40 84, 70 40, 104 52 S 150 70, 176 22" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/></mask></defs>
          <path class="plane-path" d="M6 80 C 40 84, 70 40, 104 52 S 150 70, 176 22" fill="none" mask="url(#plane-mask)"/>
          <g class="plane"><path d="M-14 -2 L 14 -12 L 6 14 L 0 4 z M0 4 L 14 -12" fill="none" stroke-linejoin="round" stroke-linecap="round"/></g>
        </svg>
        <p class="eyebrow program-eyebrow"><span class="program-num" aria-hidden="true">02</span>Go deeper · Summer 2027</p>
        <h1 class="h2" id="summer-title" data-split>Summer <em>camp</em></h1>
        <p class="time-chip" aria-hidden="true">
          <svg class="time-arc" viewBox="0 0 64 34"><path class="time-arc-path" d="M4 31 C 16 -4, 48 -4, 60 31" fill="none"/><circle class="time-arc-sun" cx="32" cy="5" r="5"/></svg>
          <span>9&nbsp;a.m.</span><i>–</i><span>3&nbsp;p.m.</span>
        </p>
        <p>Planned camp hours are 9 a.m. to 3 p.m. Join our list for dates, ages and fees.</p>
        <div class="summer-cta">
          <a class="btn btn-primary" href="#visit" data-program-cta="summer"><span>Get summer updates</span><i class="btn-dot"></i></a>

        </div>
      </div>
      <figure class="summer-photo">
        <span class="summer-sun" aria-hidden="true"><svg><use href="#d-sun"/></svg></span>
        <span class="hand-note" aria-hidden="true">details coming soon</span>
        <span class="summer-frame"><img data-photo="horse" sizes="(max-width: 767px) 100vw, 640px" alt="A young child holding a lead rope beside a white horse on a sunny farm" fetchpriority="high"></span>
      </figure>
    </div>
  </div>
</section>

<!--@summer-favorites-->



<!--@contact-->

</main>

<!--@site-foot-->
<!--@sticky-cta-->

<script type="module" src="/src/main.js"></script>
</body>
</html>
